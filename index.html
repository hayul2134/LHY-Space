<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHY Space — 모든 걸 할 수 있는 공간</title>
<meta name="description" content="일하고, 쉬고, 놀고, 대화하는 모든 것을 한곳에서. LHY Space.">
<meta name="theme-color" content="#050E24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap">
<style>
:root{
  --ice:#EAF4FF; --sky:#6FB3FF; --muted:rgba(234,244,255,.66); --line:rgba(255,255,255,.22);
  --body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Sora','Pretendard Variable',Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050E24;color:var(--ice);font-family:var(--body);color-scheme:dark}
body{background:
  radial-gradient(70% 60% at 50% 55%, rgba(30,70,190,.34), transparent 70%),
  radial-gradient(50% 40% at 85% 10%, rgba(47,107,255,.2), transparent 70%),
  linear-gradient(180deg,#050E24,#07142F 60%,#050E24)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:manipulation}
#sky.go{cursor:pointer}

#welcome{
  position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;
  font-weight:700;font-size:clamp(24px,3.4vw,40px);letter-spacing:.1em;text-indent:.1em;
  text-shadow:0 0 28px rgba(111,179,255,.75),0 0 4px rgba(255,255,255,.4);
  opacity:0;transform:translateY(-6px);transition:opacity 2s ease 1s, transform 2s ease 1s;
}
#welcome.show{opacity:1;transform:none}
#welcome.hide{opacity:0;transform:translateY(-10px);transition:opacity .6s ease, transform .6s ease}

#bar{
  position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + env(safe-area-inset-top)) 22px 0;pointer-events:none;
  opacity:0;transition:opacity .8s ease;
}
#bar.on{opacity:1}
#bar.on > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
.brand img{width:34px;height:34px}
.brand b{font:600 17px/1 var(--display)}
.brand span{font:400 17px/1 var(--display);opacity:.7;margin-left:-3px}
.glass{
  font:500 14px/1 var(--body);color:var(--ice);padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(2,8,30,.4);
}
.glass:hover{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.1))}

#labels{position:fixed;inset:0;pointer-events:none}
.label{
  position:absolute;transform:translate(-50%,10px);text-align:center;pointer-events:none;
  padding:10px 18px 11px;border-radius:22px;border:1px solid var(--line);color:var(--ice);font-family:var(--body);cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px rgba(2,8,30,.45);
  opacity:0;transition:opacity .9s ease,transform .9s ease,background .25s;
}
.label b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.label small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#labels.on .label{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#labels.on .label:nth-child(2){transition-delay:.12s}
#labels.on .label:nth-child(3){transition-delay:.24s}
#labels.on .label:nth-child(4){transition-delay:.36s}
.label:hover{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}

#toast{
  position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
@media (max-width:700px){.label{padding:8px 14px 9px}.label b{font-size:15px}.label small{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){#welcome,#bar,.label{transition-duration:.01s;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="sky" tabindex="0" role="button" aria-label="은하 안으로 들어가기"></canvas>
<h1 id="welcome">환영합니다.</h1>
<header id="bar">
  <a class="brand" href="/" aria-label="LHY Space 홈"><img src="/logo-mark.svg" alt=""><b>LHY</b><span>Space</span></a>
  <button class="glass" id="back" type="button">은하 밖으로</button>
</header>
<div id="labels"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var cv=document.getElementById('sky'), ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,dpr,mobile,rnd=Math.random;

function gauss(){var u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function rgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function sm(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}

/* 은하 팔레트: [중심, 안쪽, 바깥, 포인트] */
var PAL={
  main:['#FFFFFF','#C8E8FF','#4F86FF','#A678FF'],
  work:['#F2F8FF','#9ED0FF','#3F7BFF','#7FE0FF'],
  rest:['#E6FFFF','#7CE8F0','#3AA9FF','#B6F5E6'],
  game:['#F1ECFF','#B3A6FF','#6068FF','#E0B8FF'],
  talkA:['#FFFFFF','#8FD3FF','#4C86FF','#C7E8FF'],
  talkB:['#FFF3E0','#C8B5FF','#7A7CFF','#FFD6F0']
};

/* 은하 하나를 별 데이터와 빛 번짐 이미지로 만든다 */
function build(kind,n,pal,pal2,o){
  o=o||{}; pal2=pal2||pal;
  var X=new Float32Array(n),Y=new Float32Array(n),S=new Float32Array(n),K=new Uint8Array(n),bk={};
  var arms=o.arms||2, tw=o.tw||5.4, clus=[];
  if(o.grand){for(var cc=0;cc<110;cc++){var rc=.25+rnd()*.7,ac=((rnd()*6)|0)*1.0472+rc*tw+gauss()*.05;clus.push([Math.cos(ac)*rc,Math.sin(ac)*rc])}}
  for(var i=0;i<n;i++){
    var x,y,r,a,c=0,t=rnd(),forceAcc=false;
    if(kind==='spiral'){
      if(o.grand&&t>.94){var cl=clus[(rnd()*clus.length)|0];x=cl[0]+gauss()*.014;y=cl[1]+gauss()*.014;forceAcc=true}
      else if(t<(o.grand?.06:.14)){r=Math.sqrt(rnd())*1.08;a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}
      else if(t<.3){r=Math.abs(gauss())*(o.grand?.2:.17);a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}
      else if(o.grand&&t<.34){var bx=gauss()*.24,by=gauss()*.045;x=bx*Math.cos(.5)-by*Math.sin(.5);y=bx*Math.sin(.5)+by*Math.cos(.5)}
      else{
        r=Math.pow(rnd(),.8);
        var ai=o.grand?((rnd()*6)|0):i%arms;
        a=ai*6.2832/(o.grand?6:arms)+r*tw+(o.grand?.16*Math.sin(r*23+ai*2.1)+.07*Math.sin(r*61+ai):0)+gauss()*(o.grand?.2+.08*r:.09+.3*r);
        x=Math.cos(a)*r;y=Math.sin(a)*r;
      }
    }else if(kind==='ring'){
      a=rnd()*6.2832;
      if(t<.8)r=.64+gauss()*.065; else if(t<.93)r=Math.abs(gauss())*.1; else r=rnd()*1.0;
      x=Math.cos(a)*r;y=Math.sin(a)*r;
    }else if(kind==='elliptic'){
      a=rnd()*6.2832; r=t<.9?Math.abs(gauss())*.3:rnd()*.85;
      x=Math.cos(a)*r;y=Math.sin(a)*r*.8;
    }else{
      c=i&1; a=rnd()*6.2832; r=Math.abs(gauss())*.2*(t<.1?2.2:1);
      x=Math.cos(a)*r;y=Math.sin(a)*r;
    }
    X[i]=x;Y[i]=y;K[i]=c;
    var rl=Math.sqrt(x*x+y*y), q=rnd(), ci;
    if(q<.08||forceAcc)ci=3; else if(rl<.16)ci=q<.7?0:1; else if(rl<.55)ci=q<.6?1:2; else ci=o.grand?(q<.5?2:q<.72?3:1):(q<.75?2:1);
    var lv=rnd(); lv=lv<.5?0:lv<.86?1:2; if(rl<.2)lv=rl<.1?0:Math.min(lv,1); if(forceAcc)lv=2;
    var s=rnd(); S[i]=s<.85?1:s<.97?1.7:2.6;
    var key=(c?12:0)+ci*3+lv; (bk[key]||(bk[key]=[])).push(i);
  }
  var buckets=Object.keys(bk).map(function(k){
    k=+k; var pl=k>=12?pal2:pal;
    return {style:'rgba('+rgb(pl[((k%12)/3)|0])+','+[.35,.65,1][k%3]+')',idx:Uint32Array.from(bk[k])};
  });
  var glows=[], ng=kind==='binary'?2:1;
  for(var c2=0;c2<ng;c2++){
    var size=o.glow||512, cn=document.createElement('canvas'); cn.width=cn.height=size;
    var g=cn.getContext('2d'), up=size/2.4, half=size/2, pl2=c2?pal2:pal, pb=(o.blobs||200)/n;
    g.globalCompositeOperation='lighter';
    for(var j=0;j<n;j++){
      if(rnd()>pb||(kind==='binary'&&K[j]!==c2))continue;
      var rr=Math.sqrt(X[j]*X[j]+Y[j]*Y[j]); if(rr<.28&&rnd()>.1)continue; var col=rgb(pl2[rr<.3?1:2]), rad=(o.grand?.012+rnd()*.016:.08+rnd()*.17)*up,
          px=half+X[j]*up, py=half+Y[j]*up, gr=g.createRadialGradient(px,py,0,px,py,rad), al=(o.ga||.06)+rnd()*.05;
      gr.addColorStop(0,'rgba('+col+','+al+')'); gr.addColorStop(1,'rgba('+col+',0)');
      g.fillStyle=gr; g.fillRect(px-rad,py-rad,rad*2,rad*2);
    }
    if(o.grand&&c2===0){
      for(var ak=0;ak<6;ak++){
        for(var rs=.06;rs<1;rs+=.0025){
          var aa=ak*1.0472+rs*tw+.16*Math.sin(rs*23+ak*2.1)+.07*Math.sin(rs*61+ak),
              qx=half+Math.cos(aa)*rs*up, qy=half+Math.sin(aa)*rs*up, qrad=(.017+.01*rs)*up,
              qc=rgb(pl2[ak%2?3:2]), qa=.085*(1.15-rs*.75), qg=g.createRadialGradient(qx,qy,0,qx,qy,qrad);
          qg.addColorStop(0,'rgba('+qc+','+qa+')'); qg.addColorStop(1,'rgba('+qc+',0)');
          g.fillStyle=qg; g.fillRect(qx-qrad,qy-qrad,qrad*2,qrad*2);
        }
      }
    }
    if(o.grand&&c2===0){clus.forEach(function(cl){var px2=half+cl[0]*up,py2=half+cl[1]*up,rad2=.06*up,gr2=g.createRadialGradient(px2,py2,0,px2,py2,rad2);gr2.addColorStop(0,'rgba('+rgb(pl2[3])+',.12)');gr2.addColorStop(1,'rgba('+rgb(pl2[3])+',0)');g.fillStyle=gr2;g.fillRect(px2-rad2,py2-rad2,rad2*2,rad2*2)})}
    if(o.halo){var hg=g.createRadialGradient(half,half,0,half,half,half),hc=rgb(pl2[2]);hg.addColorStop(0,'rgba('+hc+','+o.halo+')');hg.addColorStop(.6,'rgba('+hc+','+o.halo*.35+')');hg.addColorStop(1,'rgba('+hc+',0)');g.fillStyle=hg;g.fillRect(0,0,size,size)}
    var cr=(o.coreR||.42)*up, ca=o.coreA||.55, cg=g.createRadialGradient(half,half,0,half,half,cr);
    cg.addColorStop(0,'rgba('+rgb(pl2[0])+','+ca+')'); cg.addColorStop(.35,'rgba('+rgb(pl2[1])+','+ca*.35+')'); cg.addColorStop(1,'rgba('+rgb(pl2[2])+',0)');
    g.fillStyle=cg; g.fillRect(0,0,size,size);
    glows.push(cn);
  }
  var dust=null;
  if(o.dust){
    dust=document.createElement('canvas');dust.width=dust.height=768;var dg=dust.getContext('2d'),du=768/2.4;
    for(var di=0;di<1300;di++){var dr=.18+rnd()*.78,da=(di%6)*1.0472+dr*tw+.52+gauss()*.07,dx=384+Math.cos(da)*dr*du,dy=384+Math.sin(da)*dr*du,drad=(.016+rnd()*.022)*du,dgr=dg.createRadialGradient(dx,dy,0,dx,dy,drad);dgr.addColorStop(0,'rgba(4,10,30,.15)');dgr.addColorStop(1,'rgba(4,10,30,0)');dg.fillStyle=dgr;dg.fillRect(dx-drad,dy-drad,drad*2,drad*2)}
  }
  return {kind:kind,X:X,Y:Y,S:S,K:K,buckets:buckets,glows:glows,dust:dust};
}

/* 은하 그리기. cx,cy,R은 모두 실제 픽셀 단위 */
function drawGal(G,cx,cy,R,tilt,inc,rot,alpha,sizeMul,t,gk){
  if(gk===undefined)gk=1;
  if(alpha<.004||R<2)return;
  var ci=Math.cos(inc),si=Math.sin(inc),cr=Math.cos(rot),sr=Math.sin(rot),phi=t*.45,bin=G.kind==='binary';
  var ox=.36*Math.cos(phi),oy=.36*Math.sin(phi),Wd=cv.width,Hd=cv.height,pxs=dpr*sizeMul,k,b,j,jn,i,x,y,rx,ry,sx,sy,s,idx;
  ctx.save(); ctx.globalAlpha=Math.min(1,alpha)*gk; ctx.globalCompositeOperation='lighter';
  ctx.translate(cx,cy); ctx.rotate(inc); ctx.scale(1,tilt); ctx.rotate(rot);
  for(k=0;k<G.glows.length;k++){
    ctx.save();
    if(bin){var sg=k?-1:1; ctx.translate(sg*ox*R,sg*oy*R)}
    ctx.drawImage(G.glows[k],-1.2*R,-1.2*R,2.4*R,2.4*R);
    ctx.restore();
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha=Math.min(1,alpha); ctx.globalCompositeOperation='lighter';
  for(k=0;k<G.buckets.length;k++){
    b=G.buckets[k]; ctx.fillStyle=b.style; idx=b.idx;
    for(j=0,jn=(idx.length*qual)|0;j<jn;j++){
      i=idx[j]; x=G.X[i]; y=G.Y[i];
      if(bin){ if(G.K[i]){x-=ox;y-=oy}else{x+=ox;y+=oy} }
      rx=x*cr-y*sr; ry=(x*sr+y*cr)*tilt;
      sx=cx+R*(rx*ci-ry*si); sy=cy+R*(rx*si+ry*ci);
      if(sx<-6||sx>Wd+6||sy<-6||sy>Hd+6)continue;
      s=G.S[i]*pxs; ctx.fillRect(sx-s/2,sy-s/2,s,s);
    }
  }
  ctx.restore();
  if(G.dust){ctx.save();ctx.globalAlpha=Math.min(1,alpha)*gk*.9;ctx.translate(cx,cy);ctx.rotate(inc);ctx.scale(1,tilt);ctx.rotate(rot);ctx.drawImage(G.dust,-1.2*R,-1.2*R,2.4*R,2.4*R);ctx.restore()}
}

/* 배경의 먼 별 */
var BG=[]; for(var q0=0;q0<420;q0++)BG.push({a:rnd()*6.2832,d:.04+rnd()*1.1,z:.3+rnd()*.9,s:.6+rnd()*1.3,o:.25+rnd()*.6,p:rnd()*6.28});

/* 화면 가장자리의 가까운 별 */
var FL=[[.07,.22,1],[.93,.26,.8],[.14,.8,.9],[.88,.84,1.1],[.3,.9,.6],[.75,.1,.7],[.05,.55,.6],[.96,.58,.6]];
function flares(a,t){
  if(a<.01)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var i=0;i<FL.length;i++){
    var f=FL[i],x=f[0]*cv.width,y=f[1]*cv.height,s=f[2]*dpr,al=a*(.6+.4*Math.sin(t*.9+i*2));
    var g=ctx.createRadialGradient(x,y,0,x,y,16*s);
    g.addColorStop(0,'rgba(235,245,255,'+al+')');g.addColorStop(.25,'rgba(150,200,255,'+al*.35+')');g.addColorStop(1,'rgba(100,150,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x-16*s,y-16*s,32*s,32*s);
    ctx.strokeStyle='rgba(200,225,255,'+al*.55+')';ctx.lineWidth=dpr*.8;
    ctx.beginPath();ctx.moveTo(x-34*s,y);ctx.lineTo(x+34*s,y);ctx.moveTo(x,y-34*s);ctx.lineTo(x,y+34*s);ctx.stroke();
  }
  ctx.restore();
}

/* 서비스 은하 */
var SERV=[
  {name:'작업',sub:'도구 모음',tilt:.62,inc:-.35,dir:1},
  {name:'여가',sub:'쉬어가는 곳',tilt:.5,inc:.3,dir:-1},
  {name:'게임',sub:'함께 겨루기',tilt:.7,inc:-.6,dir:1},
  {name:'소통',sub:'이야기 나누기',tilt:.8,inc:.15,dir:1}
];
var main, labelsEl=document.getElementById('labels'), labelBtns=[], hot=-1, mainR=300, mcx=0, mcy=0;
function init(){
  mobile=innerWidth<700;
  var nMain=mobile?8500:20000, nMini=mobile?1500:3200;
  main=build('spiral',nMain,PAL.main,null,{arms:2,tw:15,glow:1024,blobs:2500,coreR:.62,coreA:.85,grand:true,dust:true,halo:.18,ga:.075});
  var cfg=[
    ['spiral',PAL.work,null,{arms:2,tw:4.8,coreA:.35,coreR:.3,ga:.08}],
    ['ring',PAL.rest,null,{coreA:.2,coreR:.25,ga:.08}],
    ['elliptic',PAL.game,null,{coreR:.4,coreA:.45,ga:.08}],
    ['binary',PAL.talkA,PAL.talkB,{coreR:.35,coreA:.4,ga:.08}]
  ];
  SERV.forEach(function(s,i){
    s.g=build(cfg[i][0],nMini,cfg[i][1],cfg[i][2],cfg[i][3]); s.seed=rnd()*6; s.hv=0;
    var b=document.createElement('button'); b.type='button'; b.className='label';
    b.innerHTML='<b>'+s.name+'</b><small>'+s.sub+'</small>';
    b.addEventListener('click',function(){toast(s.name+' 공간은 아직 준비 중이에요.')});
    b.addEventListener('mouseenter',function(){hot=i}); b.addEventListener('mouseleave',function(){hot=-1});
    labelsEl.appendChild(b); labelBtns.push(b);
  });
}

function layout(){
  dpr=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  mobile=W<700; mcx=W/2; mcy=mobile?H*.54:(H+105)/2;
  mainR=mobile?Math.min(W*.4,H*.3):Math.min(W*.42,(H-135)/1.86);
  var P;
  if(mobile){var u=W*.2; P=[[.3,.24,u],[.7,.4,u*.92],[.3,.57,u*.86],[.7,.74,u*.95]]}
  else{var m=Math.min(W,H); P=[[.26,.42,m*.24],[.71,.34,m*.21],[.34,.77,m*.19],[.73,.72,m*.22]]}
  SERV.forEach(function(s,i){
    s.fx=mobile?P[i][0]*W:P[i][0]*W; s.fy=P[i][1]*H; s.R=P[i][2];
    var l=labelBtns[i]; l.style.left=s.fx+'px'; l.style.top=(s.fy+s.R*s.tilt*1.02+14)+'px';
  });
}

/* 상태: prog 0 = 바깥 큰 은하, 1 = 은하 안 */
var qual=1,fAcc=0,fN=0,prog=0,target=0,lastE=0,t=0,last=performance.now(),introT=0,hoverMain=0;
var welcome=document.getElementById('welcome'),bar=document.getElementById('bar'),toastEl=document.getElementById('toast');

function enter(){ if(target===1)return; target=1; welcome.classList.add('hide'); bar.classList.add('on'); cv.tabIndex=-1; cv.classList.remove('go') }
function leave(){ if(target===0)return; target=0; labelsEl.classList.remove('on'); bar.classList.remove('on'); welcome.classList.remove('hide'); cv.tabIndex=0 }
var tt; function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},2200)}

function frame(now){
  var raw=(now-last)/1000, dt=Math.min(.05,raw); last=now; t+=dt; fAcc+=raw;
  if(++fN>=30){var avg=fAcc/fN*1000; if(avg>30)qual=Math.max(.3,qual*.8); else if(avg<19&&qual<1)qual=Math.min(1,qual*1.12); fAcc=0; fN=0}
  if(introT<1)introT=Math.min(1,introT+dt/(reduce?.5:2.4));
  if(prog!==target){ var step=dt/(reduce?.6:(target>prog?3:2.4)); prog=target>prog?Math.min(target,prog+step):Math.max(target,prog-step) }
  var e=ease(prog), Wd=cv.width, Hd=cv.height, cx=mcx*dpr, cy=mcy*dpr;
  ctx.clearRect(0,0,Wd,Hd);

  /* 먼 별: 평소엔 반짝, 이동 중엔 바깥으로 흐름 */
  var diag=Math.sqrt(Wd*Wd+Hd*Hd)*.55, speed=Math.abs(e-lastE)/Math.max(dt,.001), span=diag*1.1, asp=Hd/Wd*1.2;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(var q=0;q<BG.length;q++){
    var s=BG[q], d0=s.d*diag, d=(d0+e*diag*2.4*s.z)%span, ca=Math.cos(s.a), sa=Math.sin(s.a);
    var al=s.o*(.65+.35*Math.sin(t*1.3+s.p)), x=cx+ca*d, y=cy+sa*d*asp;
    if(speed>.04){
      var dp=(d0+lastE*diag*2.4*s.z)%span;
      if(Math.abs(dp-d)<diag*.4){
        ctx.strokeStyle='rgba(200,225,255,'+Math.min(.7,al*(.4+speed*1.6))+')'; ctx.lineWidth=s.s*dpr*.8;
        ctx.beginPath(); ctx.moveTo(cx+ca*dp,cy+sa*dp*asp); ctx.lineTo(x,y); ctx.stroke(); continue;
      }
    }
    ctx.fillStyle='rgba(215,232,255,'+al+')'; var z=s.s*dpr; ctx.fillRect(x-z/2,y-z/2,z,z);
  }
  ctx.restore(); lastE=e;

  /* 큰 은하 */
  var zoom=reduce?1+e*.12:Math.exp(Math.log(15)*e), a1=(1-sm(.42,.9,e))*ease(introT), ip=.93+.07*ease(introT);
  hoverMain+=((cv.classList.contains('go')&&target===0?1:0)-hoverMain)*.1;
  if(a1>0){
    var tl=.86+.05*e; flares(a1*(1-sm(.05,.3,e)),t);
    drawGal(main,cx,cy,mainR*dpr*zoom*ip*(1+.015*hoverMain),tl,-.18,reduce?.4:.4-t*.06,a1*(1+.18*hoverMain),1+Math.min(zoom-1,3)*.3,t,1-sm(.1,.55,e));
  }

  /* 서비스 은하들 */
  for(var i=0;i<SERV.length;i++){
    var sv=SERV[i], local=clamp((e-.42-i*.05)/(.58-i*.05),0,1), qe=1-Math.pow(1-local,3);
    if(local<=0)continue;
    sv.hv+=((hot===i?1:0)-sv.hv)*.12;
    var px=cx+(sv.fx*dpr-cx)*qe, py=cy+(sv.fy*dpr-cy)*qe, sc=(.2+.8*qe)*(1+.08*sv.hv);
    drawGal(sv.g,px,py,sv.R*dpr*sc,sv.tilt,sv.inc,reduce?sv.seed:t*.07*sv.dir+sv.seed,qe*(1+.35*sv.hv),1,t+sv.seed*3);
  }
  if(prog>=1&&target===1&&!labelsEl.classList.contains('on'))labelsEl.classList.add('on');
  requestAnimationFrame(frame);
}

/* 입력 */
function hitMain(px,py){
  var dx=px-mcx,dy=py-mcy,ci=Math.cos(-.18),si=Math.sin(-.18),ux=dx*ci+dy*si,uy=-dx*si+dy*ci,tl=.86;
  return (ux*ux)/(mainR*mainR)+(uy*uy)/(mainR*mainR*tl*tl)<1;
}
function hitMini(px,py){
  var best=-1,bd=9;
  SERV.forEach(function(s,i){
    var dx=px-s.fx,dy=py-s.fy,ci=Math.cos(s.inc),si=Math.sin(s.inc),ux=dx*ci+dy*si,uy=-dx*si+dy*ci;
    var d=(ux*ux)/(s.R*s.R)+(uy*uy)/(s.R*s.R*s.tilt*s.tilt); if(d<1.15&&d<bd){bd=d;best=i}
  });
  return best;
}
cv.addEventListener('pointermove',function(e){
  if(target===0&&prog===0){cv.classList.toggle('go',hitMain(e.clientX,e.clientY))}
  else if(prog===1){var h=hitMini(e.clientX,e.clientY);hot=h;cv.classList.toggle('go',h>-1)}
});
cv.addEventListener('pointerleave',function(){if(prog===1)hot=-1;cv.classList.remove('go')});
cv.addEventListener('click',function(e){
  if(target===0){ if(prog===0&&hitMain(e.clientX,e.clientY))enter() }
  else if(prog===1){var h=hitMini(e.clientX,e.clientY); if(h>-1)toast(SERV[h].name+' 공간은 아직 준비 중이에요.')}
});
cv.addEventListener('keydown',function(e){ if(target===0&&(e.key==='Enter'||e.key===' ')){e.preventDefault();enter()} });
addEventListener('keydown',function(e){ if(e.key==='Escape')leave() });
document.getElementById('back').addEventListener('click',leave);
addEventListener('resize',layout);

init(); layout();
requestAnimationFrame(function(n){last=n;frame(n)});
setTimeout(function(){welcome.classList.add('show')},50);
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}
})();
</script>
</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHY Space — 하나의 우주, 나만의 공간</title>
<meta name="description" content="하나의 우주, 나만의 공간. 일하고, 쉬고, 놀고, 대화하는 모든 것을 한곳에서. LHY Space.">
<meta name="theme-color" content="#050E24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap">
<style>
:root{
  --ice:#EAF4FF; --sky:#6FB3FF; --muted:rgba(234,244,255,.66); --line:rgba(255,255,255,.22);
  --body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Sora','Pretendard Variable',Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050E24;color:var(--ice);font-family:var(--body);color-scheme:dark}
body{background:
  radial-gradient(70% 60% at 50% 55%, rgba(30,70,190,.34), transparent 70%),
  radial-gradient(50% 40% at 85% 10%, rgba(47,107,255,.2), transparent 70%),
  linear-gradient(180deg,#050E24,#07142F 60%,#050E24)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:manipulation}
#sky.go{cursor:pointer}

#welcome{
  position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;
  font-weight:700;font-size:clamp(24px,3.4vw,40px);letter-spacing:.5em;text-indent:.5em;
  text-shadow:0 0 28px rgba(111,179,255,.75),0 0 4px rgba(255,255,255,.4);
  opacity:0;transform:translateY(-6px);
  transition:opacity 1.6s ease 1.9s, transform 1.6s ease 1.9s, letter-spacing 2.2s cubic-bezier(.2,.7,.2,1) 1.9s, text-indent 2.2s cubic-bezier(.2,.7,.2,1) 1.9s;
}
#welcome.show{opacity:1;transform:none;letter-spacing:.1em;text-indent:.1em}
#welcome.hide{opacity:0;transform:translateY(-10px);transition:opacity .6s ease, transform .6s ease}

#bar{
  position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(22px + env(safe-area-inset-top)) clamp(18px,3.4vw,52px) 0;pointer-events:none;
  opacity:0;animation:fadein 1.4s ease 1.6s forwards;
}
@keyframes fadein{to{opacity:1}}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#back{opacity:0;pointer-events:none;transition:opacity .8s ease,background .25s}
#bar.on #back{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;pointer-events:auto}
.mk{position:relative;display:block;width:34px;height:34px;font-style:normal}
.mk img{position:absolute;left:2px;top:2px;width:30px;height:30px;filter:drop-shadow(0 0 14px rgba(80,140,255,.7))}
.wm{height:16px;width:auto;display:block;color:#fff;overflow:visible;filter:drop-shadow(0 0 10px rgba(110,165,255,.6))}
.lhy{font:italic 700 20px/1 var(--display);letter-spacing:.02em;padding-right:.1em;color:#fff;filter:drop-shadow(0 0 10px rgba(110,165,255,.6))}



#tag{
  position:fixed;left:clamp(18px,3.4vw,52px);top:clamp(120px,17vh,190px);display:flex;gap:12px;align-items:flex-start;pointer-events:none;
  opacity:0;animation:fadein 1.6s ease 2.4s forwards;
}
#tag svg{width:26px;height:100px;overflow:visible;flex:none}
#tag path{fill:none;stroke:rgba(170,212,255,.7);stroke-width:1.1;stroke-dasharray:130;stroke-dashoffset:130;animation:trace 1.6s ease 2.4s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}
#tag circle{fill:#fff;filter:drop-shadow(0 0 4px rgba(140,190,255,1)) drop-shadow(0 0 9px rgba(110,170,255,.6));animation:tw 3.6s ease-in-out infinite}

#tag circle{transform-box:fill-box;transform-origin:center}
#tag circle.lit{opacity:0;animation:starin .8s ease-out both, tw 3.6s ease-in-out infinite;animation-delay:calc(2.4s + var(--r,0)*.32s), calc(3.3s + var(--r,0)*.32s)}
#tag circle.off{opacity:0;filter:none;animation:dimin .7s ease both;animation-delay:calc(2.4s + var(--r,0)*.32s)}
@keyframes starin{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(2.4)}100%{opacity:1;transform:scale(1)}}
@keyframes dimin{from{opacity:0}to{opacity:.3}}
#tag circle.pop{animation:popstar 1.4s ease-out, tw 3.6s ease-in-out 1.4s infinite}
@keyframes popstar{0%{transform:scale(1)}30%{transform:scale(3.4)}100%{transform:scale(1)}}
#tag p em{display:block;margin-top:2px;font:400 10px/1.4 var(--body);letter-spacing:.14em;font-style:normal;opacity:.65}
#tag p span{display:block}
#tag p{margin:6px 0 0;font:500 11px/28px var(--display);letter-spacing:.38em;color:rgba(222,238,255,.88);text-shadow:0 0 12px rgba(111,179,255,.65)}
.glass{
  font:500 14px/1 var(--body);color:var(--ice);padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(2,8,30,.4);
}
.glass:hover{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.1))}

#labels{position:fixed;inset:0;pointer-events:none}
.label{
  position:absolute;transform:translate(-50%,10px);text-align:center;pointer-events:none;
  padding:10px 18px 11px;border-radius:22px;border:1px solid var(--line);color:var(--ice);font-family:var(--body);cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px rgba(2,8,30,.45);
  opacity:0;transition:opacity .9s ease,transform .9s ease,background .25s;
}
.label b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.label small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#labels.on .label{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#labels.on .label:nth-child(2){transition-delay:.12s}
#labels.on .label:nth-child(3){transition-delay:.24s}
#labels.on .label:nth-child(4){transition-delay:.36s}
.label:hover{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}

#tag{transition:opacity .6s ease}
#tag.off{opacity:0!important;pointer-events:none}
#sub{position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease .5s}
#sub.on{opacity:1}
#sub b{display:block;font:600 12px/1 var(--display);letter-spacing:.42em;text-indent:.42em;color:rgba(222,238,255,.92);text-shadow:0 0 14px rgba(111,179,255,.7)}
#sub small{display:block;margin-top:10px;font:300 14px/1 var(--body);letter-spacing:.24em;text-indent:.24em;color:rgba(222,238,255,.7)}
#me{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .5s ease;will-change:transform}
#me span{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 11px/1 var(--body);letter-spacing:.1em;color:var(--ice);white-space:nowrap}
#me i{width:7px;height:7px;border-radius:50%;background:#8FD3FF}
#me.hot{pointer-events:auto}
#me button{display:none;margin-left:2px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--ice);font:500 10.5px/1 var(--body);cursor:pointer}
#me.hot button{display:inline-block}
.acts{display:flex;gap:8px;align-items:center;pointer-events:none}
#login{pointer-events:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
#login img{width:22px;height:22px;border-radius:50%}
#bar:not(.on) #back{display:none}
#umenu{position:fixed;right:clamp(18px,3.4vw,52px);top:calc(74px + env(safe-area-inset-top));padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:none;flex-direction:column;gap:10px;font:400 12px var(--body);color:var(--muted);box-shadow:0 18px 40px rgba(2,8,30,.45);z-index:5}
#umenu.on{display:flex}
#umenu button{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--ice);font:500 13px var(--body);cursor:pointer}
#plp{position:fixed;right:clamp(14px,3vw,40px);top:96px;width:min(360px,calc(100vw - 28px));max-height:calc(100vh - 130px);overflow:auto;padding:16px 16px 18px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 24px 50px rgba(2,8,30,.45);opacity:0;pointer-events:none;transform:translateX(18px);transition:opacity .6s ease .5s,transform .6s ease .5s}
#plp.on{opacity:1;pointer-events:auto;transform:none}
#plp .tabs{display:flex;gap:6px;margin-bottom:14px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07)}
#plp .tab{flex:1;padding:8px 0;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer}
#plp .tab.on{background:rgba(255,255,255,.18);color:var(--ice)}
#plp .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0}
#plp .row>span{font:500 12.5px var(--body);color:var(--muted);flex:none;width:48px}
#plp .opts{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
#plp .chip{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#plp .chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(111,179,255,.6)}
#plp .sg{padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ice);font:500 12px var(--body);cursor:pointer}
#plp .sg.on{background:rgba(111,179,255,.35);border-color:rgba(160,205,255,.8)}
#plp input{width:100%;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--ice);font:500 14px var(--body);outline:none}
#plp input:focus{border-color:rgba(160,205,255,.8)}
#plp .note{margin-top:14px;font:400 11.5px/1.6 var(--body);color:var(--muted)}
#plp .sub{margin:16px 0 6px;font:600 12px var(--body);color:var(--muted)}
#plp .vt{font:700 15px var(--body);margin-bottom:4px}
#plp .list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto;margin-bottom:10px}
#plp .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.07)}
#plp .li b{display:block;font:600 13px var(--body)}
#plp .li small{display:block;margin-top:2px;font:400 11.5px var(--body);color:var(--muted)}
#plp .li button{padding:6px 12px;border-radius:999px;border:1px solid rgba(160,205,255,.6);background:rgba(111,179,255,.25);color:var(--ice);font:500 12px var(--body);cursor:pointer;flex:none}
#pane-pl input+.sub,#pane-pl .row+input{margin-top:6px}
#plp .bx{display:flex;gap:6px;flex:none}
#plp .li button.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
#plp .vrow{display:flex;gap:8px;margin:6px 0 2px}
#plp .tab{font-size:12.5px}
#rep,#mk{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,8,30,.5);z-index:20}
#rep.on,#mk.on{display:flex}
#rep .rbox,#mk .rbox{width:min(320px,calc(100vw - 40px));padding:20px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px rgba(2,8,30,.55)}
#rep .rbox>b,#mk .rbox>b{font:700 15px var(--body);text-align:center}
#mk p{font:400 12.5px/1.6 var(--body);color:var(--muted);text-align:center;margin:0}
#mk input{width:100%;padding:11px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ice);font:500 15px var(--body);outline:none;text-align:center}
#mk input::placeholder{color:rgba(226,236,255,.74)}
#mk .mkr{display:flex;flex-direction:column;align-items:center;gap:6px}
#mk .mkr button{padding:7px 14px;font-size:12.5px}
#mk small{display:block;min-height:17px;font:400 11.5px/1.5 var(--body);color:rgba(222,236,255,.8);text-align:center}
#mk .mkh{display:flex;gap:8px;justify-content:center}
#mk .mkh button{width:38px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ice);font-size:16px;cursor:pointer}
#mk .mkh button.on{background:rgba(111,179,255,.35);border-color:rgba(160,205,255,.85)}
#mk input:focus{border-color:rgba(160,205,255,.85)}
#mk .mkc{display:flex;gap:10px;justify-content:center}
#mk .mkc button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#mk .mkc button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(111,179,255,.6)}
#galhud{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,12px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;box-shadow:0 20px 44px rgba(2,8,30,.45);max-width:calc(100vw - 24px)}
#galhud.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#galhud .gi{min-width:170px;text-align:center}
#galhud .gi b{display:block;font:700 16px var(--body)}
#galhud .gi small{display:block;margin-top:3px;font:400 12px var(--body);color:var(--muted)}
#galhud .glass{padding:9px 14px;font-size:13px;white-space:nowrap}
@media (max-width:700px){#galhud{gap:8px;padding:10px 12px}#galhud .gi{min-width:100px}#galhud .gi b{font-size:14px}#intinfo{top:112px}}
#intinfo{position:fixed;left:clamp(18px,3.4vw,52px);top:96px;max-width:min(420px,60vw);pointer-events:none;opacity:0;transition:opacity .6s ease}
#intinfo.on{opacity:1}
#intinfo b{display:block;font:700 22px var(--body);text-shadow:0 0 16px rgba(2,8,30,.7)}
#intinfo small{display:block;margin-top:5px;font:400 13px/1.5 var(--body);color:rgba(236,244,255,.88);text-shadow:0 0 10px rgba(2,8,30,.8)}
#decbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,12px);width:min(860px,calc(100vw - 20px));padding:12px 14px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;box-shadow:0 20px 44px rgba(2,8,30,.45)}
#decbar.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#decbar .dr{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
#decbar .dr2{display:flex;gap:6px}
#decbar .dl{font:500 12px var(--body);color:var(--muted)}
#decbar button{padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--ice);font:500 12px var(--body);cursor:pointer}
#decbar button.on{background:rgba(111,179,255,.38);border-color:rgba(160,205,255,.85)}
#decbar #dec-ok{padding:8px 18px;font-size:13px;margin-left:auto}
#decbar input{flex:1;min-width:130px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--ice);font:500 12.5px var(--body);outline:none}
#decbar #dec-cnt{font:500 12px var(--body);color:var(--muted)}
#st{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .25s ease;will-change:transform}
#st span{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:500 11.5px/1 var(--body);color:var(--ice);white-space:nowrap}
#st em{font-style:normal;opacity:.55}
#rep .ra{display:flex;flex-direction:column;gap:8px}
#rep .ra button{padding:11px 0;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--ice);font:500 14px var(--body);cursor:pointer}
#plp .big{width:100%;margin-top:16px;padding:13px 0;font-size:14px}
#plname{position:fixed;transform:translate(-50%,0);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease .6s}
#plname b{display:block;font:700 18px var(--body);text-shadow:0 0 14px rgba(111,179,255,.6)}
#plname small{display:block;margin-top:3px;font:400 12px var(--body);color:var(--muted)}
#plhint{position:fixed;left:clamp(14px,3.4vw,52px);bottom:calc(26px + env(safe-area-inset-bottom));padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:400 12px var(--body);color:var(--muted);opacity:0;pointer-events:none;transition:opacity .6s ease .8s}
#plhint.on{opacity:1}
@media (max-width:700px){#plp{top:auto;bottom:12px;left:14px;right:14px;width:auto;max-height:48vh}#plhint{display:none}}
#toast{
  position:fixed;left:50%;top:calc(15vh + env(safe-area-inset-top));transform:translate(-50%,-10px);
  padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
@media (max-width:700px){.wm{height:13px}.lhy{font-size:16px}.label{padding:8px 14px 9px}.label b{font-size:15px}.label small{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){#welcome,#bar,.label{transition-duration:.01s;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="sky" tabindex="0" role="button" aria-label="은하 안으로 들어가기"></canvas>
<h1 id="welcome">환영합니다.</h1>
<header id="bar">
  <a class="brand" href="/" aria-label="LHY Space 홈">
    <em class="mk"><img src="/logo-mark.svg" alt="">

<script>
(function(){

function saveMe(){try{localStorage.setItem('lhy.me',JSON.stringify(ME))}catch(e){} if(FB.user&&FB.F)cloudPush(false)}
saveMe();
var TAGORD=[0,1,3,2,4,5];

  var cs=document.querySelectorAll('#tag circle'), n=Math.min(6,1+ME.v+ME.sv.length);

    var c=cs[ci]; if(!c)return; c.style.setProperty('--r',rank); c.classList.toggle('off',rank>=n); c.classList.toggle('lit',rank<n);

}

}

function gauss(){var u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}

function clamp(x,a,b){return x<a?a:x>b?b:x}
function sm(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}

/* 값 노이즈: 은하의 구름 덩어리와 어두운 틈을 만든다 */
function hash(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}

  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1+5,y*2.1+3)*.3+vnoise(x*4.3+9,y*4.3+7)*.15}
/* 소용돌이 왜곡: 바깥으로 갈수록 크게 휘감기고, 가운데는 멀리 있는 것처럼 압축된다 */
function W2(x,y){
  var r=Math.sqrt(x*x+y*y), amp=.06+.15*r,
      wx=x+(fbm(x*4.5+2,y*4.5+7)-.5)*2*amp, wy=y+(fbm(x*4.5+9,y*4.5+1)-.5)*2*amp,
      rr=Math.sqrt(wx*wx+wy*wy),
      d=(fbm(wx*2.6+7,wy*2.6+3)-.5)*1.8*rr*rr+1.1*rr*rr*rr,
      c=Math.cos(d), s=Math.sin(d), ux=wx*c-wy*s, uy=wx*s+wy*c,

/* 은하 바깥 경계: 방향마다 길이가 달라지고 서서히 사라진다 */
function fall(x,y,ai){
  var rr=Math.sqrt(x*x+y*y),ph=Math.atan2(y,x),
      edge=.76+.34*fbm(Math.cos(ph)*1.7+4,Math.sin(ph)*1.7+2)+.2*(hash(ai,3)-.5),

function grandGlow(g,size,tw,pal){
  var up=size/2.4,half=size/2,cV=rgb('#7A5CFF'),cB=rgb(pal[2]),cL=rgb(pal[1]),cC=rgb('#4A5CFF');
  g.globalCompositeOperation='lighter';
  for(var i=0;i<46000;i++){
    var r=.06+(rnd()<.45?.15+rnd()*.55:Math.pow(rnd(),1.3))*1.04, ai=(rnd()*6)|0,
        a=ai*1.0472+r*tw+.16*Math.sin(r*23+ai*2.1)+.07*Math.sin(r*61+ai)+gauss()*(.16+.08*r),
        w2=W2(Math.cos(a)*r,Math.sin(a)*r), x=w2[0], y=w2[1], n=fbm(x*7+3,y*7+1), k=(n-.18)*2.8*(1.3-.6*Math.min(1,Math.sqrt(x*x+y*y)))*fall(x,y,ai);

}

/* 은하 팔레트: [중심, 안쪽, 바깥, 포인트] */
var PAL={
  main:['#FFF3DC','#BFD8FF','#3F6BFF','#8F6BFF'],
  work:['#F2F8FF','#9ED0FF','#3F7BFF','#7FE0FF'],
  rest:['#E6FFFF','#7CE8F0','#3AA9FF','#B6F5E6'],
  game:['#F1ECFF','#B3A6FF','#6068FF','#E0B8FF'],
  talkA:['#FFFFFF','#8FD3FF','#4C86FF','#C7E8FF'],
  talkB:['#FFF3E0','#C8B5FF','#7A7CFF','#FFD6F0']
};

/* 은하 하나를 별 데이터와 빛 번짐 이미지로 만든다 */
function build(kind,n,pal,pal2,o){
  o=o||{}; pal2=pal2||pal;
  var X=new Float32Array(n),Y=new Float32Array(n),S=new Float32Array(n),K=new Uint8Array(n),Z=new Float32Array(n),bk={};
  var arms=o.arms||2, tw=o.tw||5.4, clus=[];
  if(o.grand){for(var cc=0;cc<110;cc++){var rc=.25+rnd()*.7,ac=((rnd()*6)|0)*1.0472+rc*tw+gauss()*.05;clus.push(W2(Math.cos(ac)*rc,Math.sin(ac)*rc))}}
  for(var i=0;i<n;i++){
    var x,y,r,a,c=0,t=rnd(),forceAcc=false;

      else if(t<(o.grand?.06:.14)){r=o.grand?Math.abs(gauss())*.5:Math.sqrt(rnd())*1.08;a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}
      else if(t<(o.grand?.37:.3)){r=Math.abs(gauss())*(o.grand?.24:.17);a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}

    }else if(kind==='elliptic'){

    }else{
      c=i&1; a=rnd()*6.2832; r=Math.abs(gauss())*.2*(t<.1?2.2:1);

    var lv=rnd(); lv=lv<.5?0:lv<.86?1:2; if(rl<.2)lv=rl<.1?0:Math.min(lv,1); if(forceAcc)lv=2;
    var s=rnd(); S[i]=(s<.85?1:s<.97?1.7:2.6)*(o.grand?.55+.75*Math.min(1,rl/.85):1);
    var key=(c?12:0)+ci*3+lv; (bk[key]||(bk[key]=[])).push(i);
  }
  var buckets=Object.keys(bk).map(function(k){
    k=+k; var pl=k>=12?pal2:pal;
    return {style:'rgba('+rgb(pl[((k%12)/3)|0])+','+[.35,.65,1][k%3]+')',idx:Uint32Array.from(bk[k])};
  });
  var glows=[], ng=kind==='binary'?2:1;
  for(var c2=0;c2<ng;c2++){
    var size=o.glow||512, cn=document.createElement('canvas'); cn.width=cn.height=size;
    var g=cn.getContext('2d'), up=size/2.4, half=size/2, pl2=c2?pal2:pal, pb=(o.blobs||200)/n;
    g.globalCompositeOperation='lighter';
    for(var j=0;j<n;j++){
      if(rnd()>pb||(kind==='binary'&&K[j]!==c2))continue;
      var rr=Math.sqrt(X[j]*X[j]+Y[j]*Y[j]); if(rr<.28&&rnd()>.1)continue; var col=rgb(pl2[rr<.3?1:2]), rad=(o.grand?.012+rnd()*.016:.08+rnd()*.17)*up,
          px=half+X[j]*up, py=half+Y[j]*up, gr=g.createRadialGradient(px,py,0,px,py,rad), al=(o.ga||.06)+rnd()*.05;

    if(o.grand&&c2===0){clus.forEach(function(cl){var px2=half+cl[0]*up,py2=half+cl[1]*up,rad2=.035*up,gr2=g.createRadialGradient(px2,py2,0,px2,py2,rad2);gr2.addColorStop(0,'rgba('+rgb(pl2[1])+',.05)');gr2.addColorStop(1,'rgba('+rgb(pl2[1])+',0)');g.fillStyle=gr2;g.fillRect(px2-rad2,py2-rad2,rad2*2,rad2*2)})}

/* 별 속으로 들어갈 때 터지는 빛 */
function bloom(cx,cy,R,e,col){
  var b=sm(.3,.72,e)*(1-sm(.8,1,e)); if(b<.01)return;
  var rr=R*(.12+1.7*e*e);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
  g.addColorStop(0,'rgba(255,255,255,'+(.95*b)+')'); g.addColorStop(.25,'rgba('+col+','+(.7*b)+')'); g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g; ctx.fillRect(cx-rr,cy-rr,rr*2,rr*2); ctx.restore();
}

/* 첫 등장: 중심에서 터지는 빛과 퍼지는 충격파 */
function burst(cx,cy,R,u,tilt){
  if(reduce||u>=.6)return;
  var fl=sm(0,.07,u)*(1-sm(.07,.45,u)), rr=R*(.25+1.1*u);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  if(fl>.01){
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
    g.addColorStop(0,'rgba(255,248,235,'+.95*fl+')'); g.addColorStop(.3,'rgba(150,190,255,'+.4*fl+')'); g.addColorStop(1,'rgba(60,100,255,0)');
    ctx.fillStyle=g; ctx.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  }
  for(var k=0;k<2;k++){
    var p=clamp((u-.04-k*.07)/.5,0,1); if(p<=0||p>=1)continue;
    var pe=1-Math.pow(1-p,3), a=(1-p)*(k?.3:.55);
    ctx.strokeStyle='rgba(160,200,255,'+a+')'; ctx.lineWidth=(k?2:3.5)*dpr*(1-p*.6);
    ctx.beginPath(); ctx.ellipse(cx,cy,R*1.5*pe,R*1.5*pe*tilt,-.35,0,6.2832); ctx.stroke();
  }
  ctx.restore();
}

function flares(a,t){
  if(a<.01)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var i=0;i<FL.length;i++){
    var f=FL[i],x=f[0]*cv.width,y=f[1]*cv.height,s=f[2]*dpr*.3,al=a*(.6+.4*Math.sin(t*.9+i*2));
    var g=ctx.createRadialGradient(x,y,0,x,y,16*s);
    g.addColorStop(0,'rgba(235,245,255,'+al+')');g.addColorStop(.25,'rgba(150,200,255,'+al*.35+')');g.addColorStop(1,'rgba(100,150,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x-16*s,y-16*s,32*s,32*s);
    ctx.strokeStyle='rgba(200,225,255,'+al*.55+')';ctx.lineWidth=dpr*.8;
    ctx.beginPath();ctx.moveTo(x-18*s,y);ctx.lineTo(x+18*s,y);ctx.moveTo(x,y-18*s);ctx.lineTo(x,y+18*s);ctx.stroke();
  }
  ctx.restore();
}

/* 서비스 은하 */
var SERV=[
  {name:'작업',sub:'내 도구함',tilt:.62,inc:-.35,dir:1},
  {name:'여가',sub:'나만의 쉼터',tilt:.5,inc:.3,dir:-1},
  {name:'게임',sub:'내 기록',tilt:.7,inc:-.6,dir:1},
  {name:'다른 행성',key:'소통',sub:'공개된 행성으로 떠나기',tilt:.8,inc:.15,dir:1}
];
var main, labelsEl=document.getElementById('labels'), labelBtns=[], hot=-1, mainR=300, mcx=0, mcy=0;
function init(){
  mobile=innerWidth<700;
  var nMain=mobile?9500:29000, nMini=mobile?1500:3200;
  main=build('spiral',nMain,PAL.main,null,{arms:2,tw:11,glow:1024,blobs:400,coreR:.4,coreA:.9,grand:true,dust:true,halo:.2,ga:.06});
  var cfg=[
    ['spiral',PAL.work,null,{arms:2,tw:4.8,coreA:.35,coreR:.3,ga:.08}],
    ['ring',PAL.rest,null,{coreA:.2,coreR:.25,ga:.08}],
    ['elliptic',PAL.game,null,{coreR:.4,coreA:.45,ga:.08}],
    ['binary',PAL.talkA,PAL.talkB,{coreR:.35,coreA:.4,ga:.08}]
  ];
  SERV.forEach(function(s,i){
    s.g=build(cfg[i][0],nMini,cfg[i][1],cfg[i][2],cfg[i][3]); s.seed=rnd()*6; s.hv=0;
    var b=document.createElement('button'); b.type='button'; b.className='label';
    b.innerHTML='<b>'+s.name+'</b><small>'+s.sub+'</small>';
    b.addEventListener('click',function(){explore(i)});
    b.addEventListener('mouseenter',function(){hot=i}); b.addEventListener('mouseleave',function(){hot=-1});
    labelsEl.appendChild(b); labelBtns.push(b);
  });
  plBtn=document.createElement('button'); plBtn.type='button'; plBtn.className='label'; plBtn.id='mypl';
  plBtn.innerHTML='<b>내 행성</b><small>내 우주선으로 떠나요</small>'; plBtn.addEventListener('click',openPlanet); labelsEl.appendChild(plBtn);
  buildPanel();
}

function layout(){
  dpr=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  mobile=W<700; mcx=W/2; mcy=mobile?H*.54:(H+105)/2;
  mainR=mobile?Math.min(W*.4,H*.3):Math.min(W*.37,(H-135)/1.31);
  var P;
  if(mobile){var u=W*.2; P=[[.3,.22,u],[.7,.35,u*.92],[.3,.53,u*.86],[.7,.68,u*.95]]}
  else{var m=Math.min(W,H); P=[[.26,.362,m*.24],[.71,.30,m*.21],[.34,.70,m*.19],[.73,.66,m*.22]]}
  SERV.forEach(function(s,i){
    s.fx=mobile?P[i][0]*W:P[i][0]*W; s.fy=P[i][1]*H; s.R=P[i][2];
    var l=labelBtns[i]; l.style.left=s.fx+'px'; l.style.top=(s.fy+s.R*s.tilt*1.02+14)+'px';
  });
  placePl();
}

/* 상태: prog 0 = 바깥 큰 은하, 1 = 은하 안 */
var px3=0,py3=0,tx3=0,ty3=0,qual=1,fAcc=0,fN=0,prog=0,target=0,lastE=0,t=0,last=performance.now(),introT=0,hoverMain=0;
var welcome=document.getElementById('welcome'),sub=document.getElementById('sub'),bar=document.getElementById('bar'),toastEl=document.getElementById('toast');

function enter(){ if(target===1)return; target=1; welcome.classList.add('hide'); sub.classList.add('on'); bar.classList.add('on'); document.getElementById('tag').classList.add('off'); cv.tabIndex=-1; cv.classList.remove('go') }
function leave(){ if(target===0)return; target=0; labelsEl.classList.remove('on'); sub.classList.remove('on'); bar.classList.remove('on'); document.getElementById('tag').classList.remove('off'); welcome.classList.remove('hide'); cv.tabIndex=0 }
var tt; function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},2200)}

function frame(now){
  var raw=(now-last)/1000, dt=Math.min(.05,raw); last=now; t+=dt; fAcc+=raw;
  if(++fN>=30){var avg=fAcc/fN*1000; if(avg>30)qual=Math.max(.3,qual*.8); else if(avg<19&&qual<1)qual=Math.min(1,qual*1.12); fAcc=0; fN=0}
  if(introT<1)introT=Math.min(1,introT+dt/(reduce?.5:2.8));
  if(prog!==target){ var step=dt/(reduce?.6:(target>prog?3:2.4)); prog=target>prog?Math.min(target,prog+step):Math.max(target,prog-step) }
  px3+=(tx3-px3)*.025; py3+=(ty3-py3)*.025;
  if(plT!==plTarget){plT=plTarget>plT?Math.min(1,plT+dt/(reduce?.4:1.1)):Math.max(0,plT-dt/(reduce?.4:.9))}
  var pe=ease(plT);
  if(galT!==galTarget){galT=galTarget>galT?Math.min(1,galT+dt/(reduce?.4:1.7)):Math.max(0,galT-dt/(reduce?.4:1.2))}
  if(intT!==intTarget){intT=intTarget>intT?Math.min(1,intT+dt/(reduce?.4:1.1)):Math.max(0,intT-dt/(reduce?.4:.9))}
  var ge=ease(galT), ie=ease(intT);
  if(galTarget&&galT<1)flightWarp+=Math.sin(Math.PI*clamp(galT,0,1))*dt*1.3;
  else if(!galTarget&&galT>0)flightWarp-=Math.sin(Math.PI*clamp(galT,0,1))*dt*1.3;
  var e=ease(prog), Wd=cv.width, Hd=cv.height, cx=mcx*dpr, cy=mcy*dpr;
  ctx.clearRect(0,0,Wd,Hd);

  /* 먼 별: 평소엔 반짝, 이동 중엔 바깥으로 흐름 */
  var ew=e-(reduce?0:Math.pow(1-introT,2)*1.2)+flightWarp, diag=Math.sqrt(Wd*Wd+Hd*Hd)*.55, speed=Math.abs(ew-lastE)/Math.max(dt,.001), span=diag*1.1, asp=Hd/Wd*1.2;
  var gl=galT>0&&galT<1, gm=gl?3:1, bx=cx, by=cy; if(galT>0){var P3o=SERV[3], kk=sm(0,.5,galT); bx=cx+(P3o.fx*dpr-cx)*kk; by=cy+(P3o.fy*dpr-cy)*kk}
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(var q=0;q<BG.length;q++){
    var s=BG[q], d0=s.d*diag, d=(((d0+ew*diag*2.4*s.z)%span)+span)%span, ca=Math.cos(s.a), sa=Math.sin(s.a);
    var al=s.o*(.65+.35*Math.sin(t*1.3+s.p)), x=bx+ca*d, y=by+sa*d*asp;
    if(speed>.04&&(q&gm)===0){
      var dp=(((d0+lastE*diag*2.4*s.z)%span)+span)%span;
      if(Math.abs(dp-d)<diag*.4){
        ctx.strokeStyle='rgba(200,225,255,'+Math.min(gl?.38:.7,al*(.4+speed*(gl?.8:1.6)))+')'; ctx.lineWidth=s.s*dpr*(gl?.5:.8);
        ctx.beginPath(); ctx.moveTo(bx+ca*dp,by+sa*dp*asp); ctx.lineTo(x,y); ctx.stroke(); continue;
      }
    }
    ctx.fillStyle='rgba(215,232,255,'+al+')'; var z=s.s*dpr; ctx.fillRect(x-z/2,y-z/2,z,z);
  }
  ctx.restore(); lastE=ew;

  /* 큰 은하 */
  var zoom=reduce?1+e*.12:Math.exp(Math.log(15)*e), a1=(1-sm(.42,.9,e))*sm(0,.4,introT), ip=.1+.9*(1-Math.pow(1-introT,3.2));
  hoverMain+=((cv.classList.contains('go')&&target===0?1:0)-hoverMain)*.1;
  burst(cx,cy,mainR*dpr,introT,.52);
  if(a1>0){
    var tl=.52+.1*e; flares(a1*(1-sm(.05,.3,e)),t);
    var R0=mainR*dpr*ip*(1+.015*hoverMain), mR=R0*zoom, mT=tl+(reduce?0:py3*.05*(1-e)+.38*Math.pow(1-introT,2.5)), mI=-.35+(reduce?0:px3*.04*(1-e)+.35*Math.pow(1-introT,2.5)), mRot=reduce?.4:.4-t*.045+.5*Math.pow(1-introT,3);
    var gx=cx, gy=cy;
    drawGal(main,gx,gy,mR,mT,mI,mRot,a1*(1+.18*hoverMain),1+Math.min(zoom-1,3)*.3,t,1-sm(.1,.55,e));
    drawMe(gx,gy,mR,mT,mI,mRot,sm(0,.4,introT)*(1-sm(.05,.3,e)),t,1);
    drawStars(gx,gy,mR,mT,mI,mRot,sm(0,.4,introT)*(1-sm(.05,.3,e)),t);
  }

  /* 서비스 은하들 */
  for(var i=0;i<SERV.length;i++){
    var sv=SERV[i], local=clamp((e-.42-i*.05)/(.58-i*.05),0,1), qe=1-Math.pow(1-local,3);
    if(local<=0)continue;
    sv.hv+=((hot===i?1:0)-sv.hv)*.12;
    var px=cx+(sv.fx*dpr-cx)*qe, py=cy+(sv.fy*dpr-cy)*qe, sc=(.2+.8*qe)*(1+.08*sv.hv), ga=1;
    if(ge>0){var P3=SERV[3], tx_=cx+(P3.fx*dpr-cx), ty_=cy+(P3.fy*dpr-cy), zz=1+ge*ge*16; px=tx_+(px-tx_)*zz; py=ty_+(py-ty_)*zz; sc*=zz; ga=(i===3)?(1-sm(.45,1,ge)):(1-sm(0,.5,ge))}
    drawGal(sv.g,px,py,sv.R*dpr*sc,sv.tilt,sv.inc,reduce?sv.seed:t*.07*sv.dir+sv.seed,qe*(1+.35*sv.hv)*(1-pe)*ga,1,t+sv.seed*3);
  }
  if(ie<.05)drawPlanetLayer(cx,cy,e*(1-ge),pe,t,dt); else if(plNameEl)plNameEl.style.opacity=0;
  drawGallery(t,dt,ge,ie);
  drawInterior(t,dt,ie);
  if(prog>=1&&target===1&&plTarget===0&&plT<.02&&galTarget===0&&galT<.02&&!labelsEl.classList.contains('on'))labelsEl.classList.add('on');
  requestAnimationFrame(frame);
}

/* 입력 */
function hitMain(px,py){
  var dx=px-mcx,dy=py-mcy,ci=Math.cos(-.35),si=Math.sin(-.35),ux=dx*ci+dy*si,uy=-dx*si+dy*ci,tl=.52;
  return (ux*ux)/(mainR*mainR)+(uy*uy)/(mainR*mainR*tl*tl)<1;
}
function hitMini(px,py){
  var best=-1,bd=9;
  SERV.forEach(function(s,i){
    var dx=px-s.fx,dy=py-s.fy,ci=Math.cos(s.inc),si=Math.sin(s.inc),ux=dx*ci+dy*si,uy=-dx*si+dy*ci;
    var d=(ux*ux)/(s.R*s.R)+(uy*uy)/(s.R*s.R*s.tilt*s.tilt); if(d<1.15&&d<bd){bd=d;best=i}
  });
  return best;
}
cv.addEventListener('pointermove',function(e){
  if(intT>.02||intTarget){return}
  if(galT>.02||galTarget){cv.classList.toggle('go',glAt(e.clientX,e.clientY)>-1);return}
  if(target===0&&prog===0){cv.classList.toggle('go',introT>.7&&(nearMe(e.clientX,e.clientY)||hitMain(e.clientX,e.clientY)))}
  else if(prog===1&&plTarget===0){var h=hitMini(e.clientX,e.clientY);hot=h;cv.classList.toggle('go',h>-1||nearPl(e.clientX,e.clientY))}
  else if(prog===1&&plTarget===1&&!VIEW.on){cv.classList.toggle('go',nbAt(e.clientX,e.clientY)>-1)}
});
cv.addEventListener('pointerleave',function(){if(prog===1)hot=-1;cv.classList.remove('go')});
cv.addEventListener('click',function(e){
  if(intT>.02||intTarget)return;
  if(galT>.02||galTarget){
    if(gDragMoved)return;
    var gi=glAt(e.clientX,e.clientY); if(gi>-1){if(Math.abs(gi-gScroll)<.5)visitPlanet(NB[gi]); else gGoal=gi}
    return;
  }
  if(target===0){ var sa=(prog===0&&introT>.7)?starAt(e.clientX,e.clientY):-1; if(sa>-1)openActs({uid:STARS[sa].id,name:STARS[sa].n,tp:'star',label:(STARS[sa].n||'이름 없는 별')+' · 별'}); else if(prog===0&&introT>.7&&(nearMe(e.clientX,e.clientY)||hitMain(e.clientX,e.clientY)))enter() }
  else if(prog===1&&plTarget===0){var h=hitMini(e.clientX,e.clientY); if(h>-1)explore(h); else if(nearPl(e.clientX,e.clientY))openPlanet()}
  else if(prog===1&&plTarget===1&&!VIEW.on){var ni=nbAt(e.clientX,e.clientY); if(ni>-1)visitPlanet(NB[ni])}
});
cv.addEventListener('keydown',function(e){ if(target===0&&(e.key==='Enter'||e.key===' ')){e.preventDefault();enter()} });
addEventListener('keydown',function(e){
  if(e.key==='Escape'){backAct();return}
  var tg=e.target&&e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    var dir=e.key==='ArrowRight'?1:-1;
    if(intTarget&&intT>.5)intScroll=clamp(intScroll+dir*160,0,W*1.4);
    else if(galTarget&&galT>.5)gGoal=clamp(gGoal+dir,0,Math.max(0,NB.length-1));
  }
});
document.getElementById('back').addEventListener('click',backAct);
addEventListener('resize',layout);
addEventListener('pointermove',function(e){tx3=e.clientX/innerWidth-.5;ty3=e.clientY/innerHeight-.5},{passive:true});

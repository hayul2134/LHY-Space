<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHY Space — 하나의 우주, 나만의 공간</title>
<meta name="description" content="하나의 우주, 나만의 공간. 일하고, 쉬고, 놀고, 대화하는 모든 것을 한곳에서. LHY Space.">
<meta name="theme-color" content="#050E24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap">
<style>
:root{
  --ice:#EAF4FF; --sky:#6FB3FF; --muted:rgba(234,244,255,.66); --line:rgba(255,255,255,.22);
  --body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Sora','Pretendard Variable',Pretendard,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050E24;color:var(--ice);font-family:var(--body);color-scheme:dark}
body{background:
  radial-gradient(70% 60% at 50% 55%, rgba(30,70,190,.34), transparent 70%),
  radial-gradient(50% 40% at 85% 10%, rgba(47,107,255,.2), transparent 70%),
  linear-gradient(180deg,#050E24,#07142F 60%,#050E24)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:manipulation}
#sky.go{cursor:pointer}

#welcome{
  position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;
  font-weight:700;font-size:clamp(24px,3.4vw,40px);letter-spacing:.5em;text-indent:.5em;
  text-shadow:0 0 28px rgba(111,179,255,.75),0 0 4px rgba(255,255,255,.4);
  opacity:0;transform:translateY(-6px);
  transition:opacity 1.6s ease 1.9s, transform 1.6s ease 1.9s, letter-spacing 2.2s cubic-bezier(.2,.7,.2,1) 1.9s, text-indent 2.2s cubic-bezier(.2,.7,.2,1) 1.9s;
}
#welcome.show{opacity:1;transform:none;letter-spacing:.1em;text-indent:.1em}
#welcome.hide{opacity:0;transform:translateY(-10px);transition:opacity .6s ease, transform .6s ease}

#bar{
  position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(22px + env(safe-area-inset-top)) clamp(18px,3.4vw,52px) 0;pointer-events:none;
  opacity:0;animation:fadein 1.4s ease 1.6s forwards;
}
@keyframes fadein{to{opacity:1}}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#back{opacity:0;pointer-events:none;transition:opacity .8s ease,background .25s}
#bar.on #back{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;pointer-events:auto}
.mk{position:relative;display:block;width:44px;height:44px;font-style:normal}
.mk img{position:absolute;left:3px;top:3px;width:38px;height:38px;filter:drop-shadow(0 0 14px rgba(80,140,255,.7))}
.brand b{font:italic 700 24px/1 var(--display);letter-spacing:.01em;background:linear-gradient(180deg,#fff 20%,#9cc6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .16em 0 .04em;margin-right:-.12em;filter:drop-shadow(0 0 12px rgba(100,160,255,.65))}
.brand span{font:300 24px/1 var(--display);opacity:.85;margin-left:-5px}

#tag{
  position:fixed;left:clamp(18px,3.4vw,52px);top:clamp(120px,17vh,190px);display:flex;gap:12px;align-items:flex-start;pointer-events:none;
  opacity:0;animation:fadein 1.6s ease 2.4s forwards;
}
#tag svg{width:26px;height:100px;overflow:visible;flex:none}
#tag path{fill:none;stroke:rgba(170,212,255,.7);stroke-width:1.1;stroke-dasharray:130;stroke-dashoffset:130;animation:trace 1.6s ease 2.4s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}
#tag circle{fill:#fff;filter:drop-shadow(0 0 4px rgba(140,190,255,1)) drop-shadow(0 0 9px rgba(110,170,255,.6));animation:tw 3.6s ease-in-out infinite}

#tag circle{transform-box:fill-box;transform-origin:center}
#tag circle.lit{opacity:0;animation:starin .8s ease-out both, tw 3.6s ease-in-out infinite;animation-delay:calc(2.4s + var(--r,0)*.32s), calc(3.3s + var(--r,0)*.32s)}
#tag circle.off{opacity:0;filter:none;animation:dimin .7s ease both;animation-delay:calc(2.4s + var(--r,0)*.32s)}
@keyframes starin{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(2.4)}100%{opacity:1;transform:scale(1)}}
@keyframes dimin{from{opacity:0}to{opacity:.3}}
#tag circle.pop{animation:popstar 1.4s ease-out, tw 3.6s ease-in-out 1.4s infinite}
@keyframes popstar{0%{transform:scale(1)}30%{transform:scale(3.4)}100%{transform:scale(1)}}
#tag p em{display:block;margin-top:2px;font:400 10px/1.4 var(--body);letter-spacing:.14em;font-style:normal;opacity:.65}
#tag p span{display:block}
#tag p{margin:6px 0 0;font:500 11px/28px var(--display);letter-spacing:.38em;color:rgba(222,238,255,.88);text-shadow:0 0 12px rgba(111,179,255,.65)}
.glass{
  font:500 14px/1 var(--body);color:var(--ice);padding:10px 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(2,8,30,.4);
}
.glass:hover{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.1))}

#labels{position:fixed;inset:0;pointer-events:none}
.label{
  position:absolute;transform:translate(-50%,10px);text-align:center;pointer-events:none;
  padding:10px 18px 11px;border-radius:22px;border:1px solid var(--line);color:var(--ice);font-family:var(--body);cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px rgba(2,8,30,.45);
  opacity:0;transition:opacity .9s ease,transform .9s ease,background .25s;
}
.label b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.label small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
#labels.on .label{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#labels.on .label:nth-child(2){transition-delay:.12s}
#labels.on .label:nth-child(3){transition-delay:.24s}
#labels.on .label:nth-child(4){transition-delay:.36s}
.label:hover{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}

#sub{position:fixed;left:0;right:0;top:calc(7vh + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease .5s}
#sub.on{opacity:1}
#sub b{display:block;font:600 12px/1 var(--display);letter-spacing:.42em;text-indent:.42em;color:rgba(222,238,255,.92);text-shadow:0 0 14px rgba(111,179,255,.7)}
#sub small{display:block;margin-top:10px;font:300 14px/1 var(--body);letter-spacing:.24em;text-indent:.24em;color:rgba(222,238,255,.7)}
#me{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .5s ease;will-change:transform}
#me span{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 11px/1 var(--body);letter-spacing:.1em;color:var(--ice);white-space:nowrap}
#me i{width:7px;height:7px;border-radius:50%;background:#8FD3FF}
#me.hot{pointer-events:auto}
#me button{display:none;margin-left:2px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--ice);font:500 10.5px/1 var(--body);cursor:pointer}
#me.hot button{display:inline-block}
#toast{
  position:fixed;left:50%;top:calc(15vh + env(safe-area-inset-top));transform:translate(-50%,-10px);
  padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
@media (max-width:700px){.label{padding:8px 14px 9px}.label b{font-size:15px}.label small{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){#welcome,#bar,.label{transition-duration:.01s;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="sky" tabindex="0" role="button" aria-label="은하 안으로 들어가기"></canvas>
<h1 id="welcome">환영합니다.</h1>
<header id="bar">
  <a class="brand" href="/" aria-label="LHY Space 홈">
    <em class="mk"><img src="/logo-mark.svg" alt="">
    </em><b>LHY</b><span>Space</span>
  </a>
  <button class="glass" id="back" type="button">은하 밖으로</button>
</header>
<aside id="tag" aria-hidden="true">
  <svg viewBox="0 0 26 100"><path d="M6 3 L14 20 L8 48 L16 76 L10 97"/><path d="M8 48 L1 41"/>
    <circle cx="6" cy="3" r="2.4"/><circle cx="14" cy="20" r="3.6"/><circle cx="8" cy="48" r="3.6"/><circle cx="1" cy="41" r="2.4"/><circle cx="16" cy="76" r="3.6"/><circle cx="10" cy="97" r="2.4"/></svg>
  <p><span>YOUR</span><span>OWN</span><span>SPACE</span><em id="tagc"></em></p>
</aside>
<div id="labels"></div>
<div id="me"><span><i></i><b>내 별</b><button type="button" id="mec">색 바꾸기</button></span></div>
<div id="sub" aria-hidden="true"><b>ONE GALAXY · YOUR OWN SPACE</b><small>하나의 우주, 나만의 공간</small></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var cv=document.getElementById('sky'), ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,dpr,mobile,rnd=Math.random;

/* 나만의 공간: 이 기기에만 저장되는 '내 별'과 '내 별자리' (로그인이 생기면 계정으로 옮긴다) */
var ME={v:0,day:'',sv:[],c:Math.floor(rnd()*5),s:rnd()}, ME_NEW=true;
try{var meX0=JSON.parse(localStorage.getItem('lhy.me')||'null'); if(meX0&&meX0.day){ME=meX0;ME_NEW=false}}catch(e){}
ME.sv=ME.sv||[]; ME.c=ME.c|0; ME.s=ME.s||rnd();
var TODAY=new Date().toISOString().slice(0,10);
if(ME.day!==TODAY){ME.v=(ME.v||0)+1;ME.day=TODAY}
function saveMe(){try{localStorage.setItem('lhy.me',JSON.stringify(ME))}catch(e){}}
saveMe();
var TAGORD=[0,1,3,2,4,5];
function paintTag(pop){
  var cs=document.querySelectorAll('#tag circle'), n=Math.min(6,1+ME.v+ME.sv.length);
  TAGORD.forEach(function(ci,rank){
    var c=cs[ci]; if(!c)return; c.style.setProperty('--r',rank); c.classList.toggle('off',rank>=n); c.classList.toggle('lit',rank<n);
    if(pop&&rank===n-1){c.classList.remove('pop');void c.getBoundingClientRect();c.classList.add('pop')}
  });
  var tc=document.getElementById('tagc'); if(tc)tc.textContent='내 별자리 '+n+' / 6';
}
function explore(i){
  var nm=SERV[i].name, isNew=ME.sv.indexOf(nm)<0;
  if(isNew){ME.sv.push(nm);saveMe();paintTag(true)}
  toast(nm+' 공간은 아직 준비 중이에요.'+(isNew?' 내 별자리에 별이 하나 켜졌어요.':''));
}

function gauss(){var u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function rgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function sm(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}

/* 값 노이즈: 은하의 구름 덩어리와 어두운 틈을 만든다 */
function hash(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
function vnoise(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1+5,y*2.1+3)*.3+vnoise(x*4.3+9,y*4.3+7)*.15}
/* 소용돌이 왜곡: 바깥으로 갈수록 크게 휘감기고, 가운데는 멀리 있는 것처럼 압축된다 */
function W2(x,y){
  var r=Math.sqrt(x*x+y*y), amp=.06+.15*r,
      wx=x+(fbm(x*4.5+2,y*4.5+7)-.5)*2*amp, wy=y+(fbm(x*4.5+9,y*4.5+1)-.5)*2*amp,
      rr=Math.sqrt(wx*wx+wy*wy),
      d=(fbm(wx*2.6+7,wy*2.6+3)-.5)*1.8*rr*rr+1.1*rr*rr*rr,
      c=Math.cos(d), s=Math.sin(d), ux=wx*c-wy*s, uy=wx*s+wy*c,
      k=rr>0?Math.pow(rr,.35):0;
  return [ux*k,uy*k];
}

/* 은하 바깥 경계: 방향마다 길이가 달라지고 서서히 사라진다 */
function fall(x,y,ai){
  var rr=Math.sqrt(x*x+y*y),ph=Math.atan2(y,x),
      edge=.76+.34*fbm(Math.cos(ph)*1.7+4,Math.sin(ph)*1.7+2)+.2*(hash(ai,3)-.5),
      v=(edge+.22-rr)/.44;
  v=v<0?0:v>1?1:v; return v*v;
}
function grandGlow(g,size,tw,pal){
  var up=size/2.4,half=size/2,cV=rgb('#7A5CFF'),cB=rgb(pal[2]),cL=rgb(pal[1]),cC=rgb('#4A5CFF');
  g.globalCompositeOperation='lighter';
  for(var i=0;i<46000;i++){
    var r=.06+(rnd()<.45?.15+rnd()*.55:Math.pow(rnd(),1.3))*1.04, ai=(rnd()*6)|0,
        a=ai*1.0472+r*tw+.16*Math.sin(r*23+ai*2.1)+.07*Math.sin(r*61+ai)+gauss()*(.16+.08*r),
        w2=W2(Math.cos(a)*r,Math.sin(a)*r), x=w2[0], y=w2[1], n=fbm(x*7+3,y*7+1), k=(n-.18)*2.8*(1.3-.6*Math.min(1,Math.sqrt(x*x+y*y)))*fall(x,y,ai);
    if(rnd()>k)continue;
    var m=fbm(x*15+11,y*15+5), cn=fbm(x*2.4+20,y*2.4+9),
        col=cn<.42?cV:cn<.58?cB:(m>.55?cL:cC),
        rad=(.007+rnd()*.02)*up*(.38+.4*r), al=(.06+.12*m)*(.95+.45*r+.6*Math.exp(-Math.pow((r-.5)/.25,2))), rr2=Math.sqrt(x*x+y*y), el=1+2.2*rr2*rr2,
        px=half+x*up, py=half+y*up, gr=g.createRadialGradient(0,0,0,0,0,rad);
    gr.addColorStop(0,'rgba('+col+','+al+')'); gr.addColorStop(1,'rgba('+col+',0)');
    g.save(); g.translate(px,py); g.rotate(Math.atan2(y,x)+1.5708-.3*rr2); g.scale(el,1);
    g.fillStyle=gr; g.fillRect(-rad,-rad,rad*2,rad*2); g.restore();
  }
}

/* 은하 팔레트: [중심, 안쪽, 바깥, 포인트] */
var PAL={
  main:['#FFF3DC','#BFD8FF','#3F6BFF','#8F6BFF'],
  work:['#F2F8FF','#9ED0FF','#3F7BFF','#7FE0FF'],
  rest:['#E6FFFF','#7CE8F0','#3AA9FF','#B6F5E6'],
  game:['#F1ECFF','#B3A6FF','#6068FF','#E0B8FF'],
  talkA:['#FFFFFF','#8FD3FF','#4C86FF','#C7E8FF'],
  talkB:['#FFF3E0','#C8B5FF','#7A7CFF','#FFD6F0']
};

/* 은하 하나를 별 데이터와 빛 번짐 이미지로 만든다 */
function build(kind,n,pal,pal2,o){
  o=o||{}; pal2=pal2||pal;
  var X=new Float32Array(n),Y=new Float32Array(n),S=new Float32Array(n),K=new Uint8Array(n),Z=new Float32Array(n),bk={};
  var arms=o.arms||2, tw=o.tw||5.4, clus=[];
  if(o.grand){for(var cc=0;cc<110;cc++){var rc=.25+rnd()*.7,ac=((rnd()*6)|0)*1.0472+rc*tw+gauss()*.05;clus.push(W2(Math.cos(ac)*rc,Math.sin(ac)*rc))}}
  for(var i=0;i<n;i++){
    var x,y,r,a,c=0,t=rnd(),forceAcc=false;
    if(kind==='spiral'){
      if(o.grand&&t>.94){var cl=clus[(rnd()*clus.length)|0];x=cl[0]+gauss()*.014;y=cl[1]+gauss()*.014;forceAcc=true}
      else if(t<(o.grand?.06:.14)){r=o.grand?Math.abs(gauss())*.5:Math.sqrt(rnd())*1.08;a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}
      else if(t<(o.grand?.37:.3)){r=Math.abs(gauss())*(o.grand?.24:.17);a=rnd()*6.2832;x=Math.cos(a)*r;y=Math.sin(a)*r}
      else if(o.grand&&t<.34){var bx=gauss()*.24,by=gauss()*.045;x=bx*Math.cos(.5)-by*Math.sin(.5);y=bx*Math.sin(.5)+by*Math.cos(.5)}
      else{
        r=(o.grand&&rnd()<.4?.15+rnd()*.6:Math.pow(rnd(),o.grand?1.1:.8))*(o.grand?1.06:1);
        var ai=o.grand?((rnd()*6)|0):i%arms;
        a=ai*6.2832/(o.grand?6:arms)+r*tw+(o.grand?.16*Math.sin(r*23+ai*2.1)+.07*Math.sin(r*61+ai):0)+gauss()*(o.grand?.2+.08*r:.09+.3*r);
        x=Math.cos(a)*r;y=Math.sin(a)*r;
        if(o.grand){var w2=W2(x,y);x=w2[0];y=w2[1];if(rnd()>fall(x,y,ai)){i--;continue}}
      }
    }else if(kind==='ring'){
      a=rnd()*6.2832;
      if(t<.8)r=.64+gauss()*.065; else if(t<.93)r=Math.abs(gauss())*.1; else r=rnd()*1.0;
      x=Math.cos(a)*r;y=Math.sin(a)*r;
    }else if(kind==='elliptic'){
      a=rnd()*6.2832; r=t<.9?Math.abs(gauss())*.3:rnd()*.85;
      x=Math.cos(a)*r;y=Math.sin(a)*r*.8;
    }else{
      c=i&1; a=rnd()*6.2832; r=Math.abs(gauss())*.2*(t<.1?2.2:1);
      x=Math.cos(a)*r;y=Math.sin(a)*r;
    }
    X[i]=x;Y[i]=y;K[i]=c;Z[i]=o.grand?gauss()*(.03+.2*Math.exp(-Math.pow(Math.sqrt(x*x+y*y)/.3,2))):0;
    var rl=Math.sqrt(x*x+y*y), q=rnd(), ci;
    if(q<.08||forceAcc)ci=3; else if(rl<.16)ci=q<.7?0:1; else if(rl<.55)ci=q<.6?1:2; else ci=o.grand?(q<.5?2:q<.72?3:1):(q<.75?2:1);
    var lv=rnd(); lv=lv<.5?0:lv<.86?1:2; if(rl<.2)lv=rl<.1?0:Math.min(lv,1); if(forceAcc)lv=2;
    var s=rnd(); S[i]=(s<.85?1:s<.97?1.7:2.6)*(o.grand?.55+.75*Math.min(1,rl/.85):1);
    var key=(c?12:0)+ci*3+lv; (bk[key]||(bk[key]=[])).push(i);
  }
  var buckets=Object.keys(bk).map(function(k){
    k=+k; var pl=k>=12?pal2:pal;
    return {style:'rgba('+rgb(pl[((k%12)/3)|0])+','+[.35,.65,1][k%3]+')',idx:Uint32Array.from(bk[k])};
  });
  var glows=[], ng=kind==='binary'?2:1;

function hitMain(px,py){
  var dx=px-mcx,dy=py-mcy,ci=Math.cos(-.35),si=Math.sin(-.35),ux=dx*ci+dy*si,uy=-dx*si+dy*ci,tl=.52;
  return (ux*ux)/(mainR*mainR)+(uy*uy)/(mainR*mainR*tl*tl)<1;
}
function hitMini(px,py){
  var best=-1,bd=9;
  SERV.forEach(function(s,i){
    var dx=px-s.fx,dy=py-s.fy,ci=Math.cos(s.inc),si=Math.sin(s.inc),ux=dx*ci+dy*si,uy=-dx*si+dy*ci;
    var d=(ux*ux)/(s.R*s.R)+(uy*uy)/(s.R*s.R*s.tilt*s.tilt); if(d<1.15&&d<bd){bd=d;best=i}
  });
  return best;
}
cv.addEventListener('pointermove',function(e){
  if(target===0&&prog===0){cv.classList.toggle('go',introT>.7&&(nearMe(e.clientX,e.clientY)||hitMain(e.clientX,e.clientY)))}
  else if(prog===1){var h=hitMini(e.clientX,e.clientY);hot=h;cv.classList.toggle('go',h>-1)}
});
cv.addEventListener('pointerleave',function(){if(prog===1)hot=-1;cv.classList.remove('go')});
cv.addEventListener('click',function(e){
  if(target===0){ if(prog===0&&introT>.7&&(nearMe(e.clientX,e.clientY)||hitMain(e.clientX,e.clientY)))enter() }
  else if(prog===1){var h=hitMini(e.clientX,e.clientY); if(h>-1)explore(h)}
});
cv.addEventListener('keydown',function(e){ if(target===0&&(e.key==='Enter'||e.key===' ')){e.preventDefault();enter()} });
addEventListener('keydown',function(e){ if(e.key==='Escape')leave() });
document.getElementById('back').addEventListener('click',leave);
addEventListener('resize',layout);
addEventListener('pointermove',function(e){tx3=e.clientX/innerWidth-.5;ty3=e.clientY/innerHeight-.5},{passive:true});

init(); layout(); paintTag(false);
document.getElementById('mec').addEventListener('click',function(e){e.stopPropagation();ME.c=(ME.c+1)%5;saveMe()});
(function(){var m=document.getElementById('me');m.addEventListener('mouseenter',function(){meOver=true});m.addEventListener('mouseleave',function(){meOver=false})})();
